# VedettaVip - stack completo (un solo server, accesso in HTTPS tramite Caddy).
#
# Uso, con il .env accanto a questo file (cp deploy/.env.example deploy/.env, poi compilarlo):
#   docker compose -f deploy/docker-compose.yml up -d --build
# Configurazione esterna (es. un repository privato con i dati dell'installazione):
#   docker compose -f <vedettavip>/deploy/docker-compose.yml -f docker-compose.override.yml --env-file .env up -d --build
# I percorsi relativi (anche quelli dell'override) partono da questa cartella.
#
# Solo Caddy espone porte (80/443); database, API, Worker e Web sono sulla rete interna di Docker.

name: vedettavip

x-dotnet: &dotnet
  restart: unless-stopped
  environment: &dotnet-env
    TZ: ${TZ:-Europe/Rome}
    DOTNET_ENVIRONMENT: Production
    ASPNETCORE_ENVIRONMENT: Production
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    # Versione fissata: deve coincidere con quella da cui si ripristinano i backup
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?manca POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?manca POSTGRES_DB in .env}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 256mb

  # Applica le migration EF e termina; l'API parte solo se è andata a buon fine
  migrate:
    <<: *dotnet
    image: vedettavip-migrator:latest
    build: { context: .., dockerfile: src/VedettaVip.Api/Dockerfile, target: migrator }
    restart: "no"
    environment:
      <<: *dotnet-env
      ConnectionStrings__VedettaVip: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *dotnet
    image: vedettavip-api:latest
    build: { context: .., dockerfile: src/VedettaVip.Api/Dockerfile, target: final }
    environment:
      <<: *dotnet-env
      ConnectionStrings__VedettaVip: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Agent__ApiKey: ${AGENT_API_KEY:?manca AGENT_API_KEY in .env}
      # Dietro Caddy: schema (https) e IP del client dagli header X-Forwarded-*
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Auth__SecureCookies: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *dotnet
    image: vedettavip-worker:latest
    build: { context: .., dockerfile: src/VedettaVip.Worker/Dockerfile }
    environment:
      <<: *dotnet-env
      Agent__ApiBaseUrl: http://api:8080
      Agent__ApiKey: ${AGENT_API_KEY:?manca AGENT_API_KEY in .env}
      Agent__AgentId: ${AGENT_ID:-vedettavip-server}
      Polling__SnmpCommunity: ${SNMP_COMMUNITY:-public}
    # Solo la capability per il ping (socket ICMP raw): tutte le altre sono tolte
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    depends_on:
      - api

  web:
    <<: *dotnet
    image: vedettavip-web:latest
    build: { context: .., dockerfile: src/VedettaVip.Web/Dockerfile }
    environment:
      <<: *dotnet-env
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Link "Source code" del footer (AGPL-3.0, sezione 13); vuoto = default di appsettings.json
      App__SourceUrl: ${APP_SOURCE_URL:-}
    volumes:
      - web-keys:/home/app/.aspnet/DataProtection-Keys

  # HTTPS con certificato della CA interna di Caddy; /api e /hubs all'API, tutto il resto al Web (stessa origine)
  caddy:
    image: caddy:2.11.6
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      VEDETTAVIP_HOST: ${VEDETTAVIP_HOST:?manca VEDETTAVIP_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

# Nomi effettivi: vedettavip_db-data, vedettavip_web-keys, vedettavip_caddy-data, vedettavip_caddy-config.
# Per riusare volumi esistenti con altri nomi: "volumes: { db-data: { name: <nome>, external: true } }" in un override.
volumes:
  db-data:
  web-keys:
  caddy-data:
  caddy-config:
